version: '3.8'

services:
  # Python FastAPI Backend (Primary)
  backend:
    build:
      context: ./backend-python
      dockerfile: Dockerfile
    container_name: akashagent-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - ./backend-python/.env
    environment:
      - PORT=5000
      - NODE_ENV=production
    volumes:
      - backend-uploads:/app/uploads
    networks:
      - akashagent-network

  # React Vite Frontend (Served by Nginx reverse proxy)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: akashagent-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - akashagent-network

  # Node.js Express Backend (Optional alternative if you prefer the Node backend)
  backend-node:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: akashagent-backend-node
    restart: unless-stopped
    ports:
      - "5001:5000"
    env_file:
      - ./backend/.env
    profiles:
      - node
    volumes:
      - node-uploads:/app/uploads
    networks:
      - akashagent-network

networks:
  akashagent-network:
    driver: bridge

volumes:
  backend-uploads:
  node-uploads:
