services:
  - type: web
    name: minigpt-backend
    env: node
    rootDir: backend
    buildCommand: npm install && npx prisma@5.16.0 generate --schema=prisma/schema.prisma
    startCommand: node src/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
